<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/premium-logo-icon.png" />
    <meta name="description" content="PremiumPLM — Product Lifecycle Management" />
    <title>Premium-PLM</title>
    <!-- Apply the saved light/dark theme (or the system one) before the app
         renders, so the page never flashes the wrong colours. Mirrors
         src/utils/theme.ts. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("plm-theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
